[project]
name = "hmtp"
version = "1.0.0"
description = "HMTP (HTTP Mail Transfer Protocol): a minimal self-hosted mail node over HTTP. No SMTP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "click",
    "cryptography",
    "flask",
    "httpx",
    "waitress",
]

[project.scripts]
hmtp = "hmtp.infra.cli.click.src.main:cli"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hmtp"]
